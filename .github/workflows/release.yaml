name: release

on:
  # 只在打 tag 时发版。曾经有个裸的 workflow_dispatch：在未打 tag 的分支上
  # 手动触发会让 goreleaser 找不到 tag 而失败，属于"看起来能用、用起来踩坑"的入口。
  # 需要重跑某次发版时，从 Actions 页面 Re-run 那次运行即可。
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: unit tests
        run: go test ./...

      - name: smoke
        shell: bash
        run: |
          go build -o bin/bs ./cmd/bs
          BS_BIN="$PWD/bin/bs" ./scripts/smoke.sh

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

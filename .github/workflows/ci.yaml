name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          out="$(gofmt -l ./cmd ./internal ./pkg ./tools)"
          if [ -n "$out" ]; then echo "未格式化："; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -race ./...

      # 冒烟测试无副作用：全部读写都在临时沙箱目录内，且不发起网络请求。
      # Windows 上没有 bash 冒烟脚本，改跑 PowerShell 版本。
      - name: smoke (posix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          go build -o bin/bs ./cmd/bs
          BS_BIN="$PWD/bin/bs" ./scripts/smoke.sh

      - name: smoke (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          go build -o bin/bs.exe ./cmd/bs
          ./scripts/smoke.ps1 -Bin "$PWD/bin/bs.exe"

  # 下面三道门禁刻意与 make check 分开：它们慢（lint）、要联网（vuln）或需要额外二进制，
  # 不该拦住"本地 check 通过就能提交"；但推送/PR 时必须由 CI 兜住。
  # 版本都只有 Makefile 一处定义（GOLANGCI_VERSION / GOVULNCHECK_VERSION），
  # 目标是"本地怎么跑，CI 就怎么跑"。
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install pinned golangci-lint
        run: make tools-lint
      - name: golangci-lint
        run: make lint

  vuln:
    name: vuln (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install pinned govulncheck
        run: make tools-vuln
      # govulncheck 只报"真会被调用到"的漏洞路径，因此它挂了就是依赖真的需要动
      #（升级依赖，或按提示升 Go 版本修 stdlib 漏洞）。
      - name: govulncheck
        run: make vuln

  coverage:
    name: coverage (floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # 阈值在 Makefile 的 COVER_MIN（只许往上抬）。掉下来要么补测试，
      # 要么在提交信息里说清为什么这次例外。
      - name: coverage gate
        run: make coverage-check

  cross-build:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build all targets
        run: make cross
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bs-cross
          path: dist/**
          if-no-files-found: error

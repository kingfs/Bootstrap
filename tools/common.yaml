      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: jesseduffield/lazydocker
          asset: "lazydocker_{{version}}_{{os|osmap:linux=Linux,darwin=Darwin}}_{{arch|archmap:amd64=x86_64,arm64=arm64}}.tar.gz"

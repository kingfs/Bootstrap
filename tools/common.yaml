    path_dirs: ["~/.local/bin"]
    verify: {command: hadolint, version_args: [--version], version_regex: 'Linter (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: hadolint}
      # 发布物是**裸二进制**（不是归档），校验和在 checksums.sha256 里（行格式是
      # `<hash> *hadolint-linux-arm64`，解析器认那个 `*`）。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: hadolint/hadolint
          asset: "hadolint-{{os|osmap:linux=linux,darwin=macos}}-{{arch|archmap:amd64=x86_64,arm64=arm64}}"
          binary: hadolint
          dest: "~/.local/bin"
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [hadolint]}


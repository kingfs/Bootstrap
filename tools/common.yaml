    name: sccache
    stack: rust
    kind: devdep
    description: 编译缓存（C/C++ 也能用，可当作 ccache 替代）
    homepage: https://github.com/mozilla/sccache
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: sccache, version_args: [--version], version_regex: 'sccache (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: sccache}
      # 实测：归档有外层目录（sccache-v0.18.0-<triple>/sccache），故 strip_components: 1；
      # 校验和是每个产物配一个 `<资产>.sha256`（内容是裸哈希）。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: mozilla/sccache
          asset: "sccache-v{{version}}-{{arch|archmap:amd64=x86_64,arm64=aarch64}}-{{os|osmap:linux=unknown-linux-musl,darwin=apple-darwin}}.tar.gz"
          strip_components: 1
          binary: sccache
          dest: "~/.local/bin"
      - via: cargo
        when: {has: [cargo]}
        params: {crate: sccache}


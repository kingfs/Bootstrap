    homepage: https://direnv.net
    verify: {command: direnv, version_args: [version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: direnv}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [direnv]}

  - id: shellcheck
    name: shellcheck
    stack: shell
    kind: devdep
    description: shell 脚本静态检查
    homepage: https://www.shellcheck.net
    verify: {command: shellcheck, version_args: [--version], version_regex: 'version: (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: shellcheck}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [shellcheck]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [ShellCheck]}

  - id: git-delta
    name: delta
    stack: base
    kind: cli
    description: git diff 的美化分页器
    homepage: https://github.com/dandavison/delta
    verify: {command: delta, version_args: [--version], version_regex: 'delta (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: git-delta}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [git-delta]}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: git-delta}

  - id: neovim
    name: Neovim
    stack: editor
    kind: cli
    description: 编辑器
    homepage: https://neovim.io
    verify: {command: nvim, version_args: [--version], version_regex: 'NVIM v(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: neovim}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [neovim]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [neovim]}

  - id: lazygit
    name: lazygit
    stack: base
    kind: cli
    description: git 的 TUI
    homepage: https://github.com/jesseduffield/lazygit
    path_dirs: ["~/.local/bin"]
    verify: {command: lazygit, version_args: [--version], version_regex: 'version=(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: lazygit}
      # 官方 release 带 checksums.txt（goreleaser 默认）
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: jesseduffield/lazygit
          asset: "lazygit_{{version}}_{{os}}_{{arch|archmap:amd64=x86_64,arm64=arm64}}.tar.gz"
          # 实测：归档根目录直接是 lazygit/LICENSE/README.md，**没有**外层目录，
          # 写 strip_components 会把文件本身剥掉（别的工具如 ripgrep 才需要 1）。
          binary: lazygit
          dest: "~/.local/bin"
      - via: goinstall
        when: {has: [go]}
        params: {module: github.com/jesseduffield/lazygit@latest}

  - id: httpie
    name: HTTPie
    stack: base
    kind: cli
    description: 人友好的 HTTP 客户端
    homepage: https://httpie.io
    verify: {command: http, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: httpie}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [httpie]}
      - via: pipx
        when: {has: [pipx]}
        params: {package: httpie}

  # ─────────── 搜索 / 对比 / 监控 / 零散工具（成套定义见 profiles.yaml） ───────────
  #
  # 这些是"想装才装"的一类，**不进 base/full**：各自成套（search / diff / monitor / extras），
  # `bs tool install --profile search` 就能一把装上。
  #
  # bat/fd 在 Debian 系被改了二进制名（bat → batcat、fd-find → fdfind），所以 verify 写两条
  # 规则、按发行版挑（docs/tool-schema.md §3.1）。四个名字都实测过：Ubuntu 24.04 的
  # bat/batcat 与 fd-find/fdfind，Fedora 的 bat（/usr/bin/bat）与 fd-find（/usr/bin/fd）。

  - id: bat
    name: bat
    stack: base
    kind: cli
    description: 带语法高亮的 cat
    homepage: https://github.com/sharkdp/bat
    verify:
      - when: {distro: [ubuntu, debian]}
        command: batcat
        version_args: [--version]
        version_regex: 'bat (?P<v>\d+\.\d+\.\d+)'
      - command: bat
        version_args: [--version]
        version_regex: 'bat (?P<v>\d+\.\d+\.\d+)'
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: bat}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [bat]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [bat]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [bat]}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: bat}

  - id: fd
    name: fd
    stack: base
    kind: cli
    description: 更快的 find（默认忽略 .gitignore）
    homepage: https://github.com/sharkdp/fd
    verify:
      - when: {distro: [ubuntu, debian]}
        command: fdfind
        version_args: [--version]
        version_regex: 'fdfind (?P<v>\d+\.\d+\.\d+)'
      - command: fd
        version_args: [--version]
        version_regex: 'fd (?P<v>\d+\.\d+\.\d+)'
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: fd}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [fd-find]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [fd-find]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [fd]}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: fd-find}

  - id: the_silver_searcher
    name: The Silver Searcher
    stack: base
    kind: cli
    description: ag：老牌快速代码搜索
    homepage: https://github.com/ggreer/the_silver_searcher
    verify: {command: ag, version_args: [--version], version_regex: 'ag version (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: the_silver_searcher}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [silversearcher-ag]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [the_silver_searcher]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [the_silver_searcher]}

  - id: difftastic
    name: difftastic
    stack: base
    kind: cli
    description: 结构化 diff（按语法树比，而不是按行）
    homepage: https://github.com/Wilfred/difftastic
    # 实测：Ubuntu/Debian **没有**这个包（noble 的 universe+multiverse 索引里搜不到），
    # 所以 Linux 侧只能靠发行版包（Fedora/Arch）或 cargo 现场编。
    verify: {command: difft, version_args: [--version], version_regex: 'Difftastic (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: difftastic}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [difftastic]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [difftastic]}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: difftastic}

  - id: bottom
    name: bottom
    stack: base
    kind: cli
    description: 图形化系统监控 TUI（命令叫 btm）
    homepage: https://github.com/ClementTsang/bottom
    # 实测：命令名 `btm`，但 `btm --version` 打印的是 "bottom 0.9.6"，正则按输出写。
    verify: {command: btm, version_args: [--version], version_regex: 'bottom (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: bottom}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [btm]}   # Debian 系的包名是 btm（不是 bottom）
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [bottom]}
      # Fedora 至今没打包 bottom（f40–f43/rawhide/el9/el10 都没有），所以没有 dnf 方式。
      - via: cargo
        when: {has: [cargo]}
        params: {crate: bottom}

  - id: hyperfine
    name: hyperfine
    stack: base
    kind: cli
    description: 命令行基准测试（跑多少遍、热身、导出）
    homepage: https://github.com/sharkdp/hyperfine
    verify: {command: hyperfine, version_args: [--version], version_regex: 'hyperfine (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: hyperfine}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [hyperfine]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [hyperfine]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [hyperfine]}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: hyperfine}

  - id: goaccess
    name: GoAccess
    stack: base
    kind: cli
    description: 终端里的 Web 日志实时分析
    homepage: https://goaccess.io
    verify: {command: goaccess, version_args: [--version], version_regex: 'GoAccess - (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: goaccess}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [goaccess]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [goaccess]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [goaccess]}

  - id: ctop
    name: ctop
    stack: base
    kind: cli
    description: 容器资源的 htop 式界面
    homepage: https://github.com/bcicen/ctop
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: ctop, version_args: [-v], version_regex: 'ctop version (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: ctop}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [ctop]}
      - via: release
        when: {os: [linux]}
        params:
          repo: bcicen/ctop
          # 实测：资产是**裸二进制**（没有归档），必须显式写 binary；校验和文件叫
          # sha256sums.txt（注意是 sha256sums，不在常见名字链里，得点名 checksum_file）。
          asset: "ctop-{{version}}-linux-{{arch}}"
          checksum_file: sha256sums.txt
          binary: ctop
          dest: "~/.local/bin"

  - id: witr
    name: witr
    stack: base
    kind: cli
    description: 追一个进程/端口/文件是谁拉起来的
    homepage: https://github.com/pranshuparmar/witr
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: witr, version_args: [--version], version_regex: 'witr v(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: witr}
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: pranshuparmar/witr
          # 实测：Linux/macOS 的资产是**裸二进制**（不是归档），asset 名里没有版本号，
          # {{os}}/{{arch}} 正好对上；因为不是归档，不能写 strip_components，
          # 也必须显式写 binary（否则默认会按资产名去找 "witr-linux-amd64"）。
          asset: "witr-{{os}}-{{arch}}"
          binary: witr
          dest: "~/.local/bin"
      - via: goinstall
        when: {has: [go]}
        params: {module: "github.com/pranshuparmar/witr/cmd/witr@latest"}

  - id: herdr
    name: herdr
    stack: agent
    kind: agent
    description: 编码代理的终端工作区管理器
    homepage: https://herdr.dev
    when: {os: [linux, darwin]}
    verify: {command: herdr, version_args: [--version], version_regex: 'herdr (?P<v>\d+\.\d+\.\d+)'}
    install:
      # 上游的安装渠道：brew（macOS 与 Linuxbrew）、官方 install.sh（属于 via: script，
      # 内置清单不用）、以及 Release 里的裸二进制。Release 页**确实没有** checksums 文件，
      # 但 release 是 immutable 的，GitHub API 会给每个资产一个 sha256 digest，
      # 引擎在所有校验和文件都拿不到时会退回到它（docs/tool-schema.md §7）——
      # 所以"没有 brew 的 Linux 机器装不了"这个老缺口已经补上。
      - via: brew
        when: {has: [brew]}
        params: {formula: herdr}
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: herdrdev/herdr
          # 资产名用 x86_64/aarch64（不是 {{arch}} 的 amd64/arm64），macOS 写成 macos；
          # 产物是**裸二进制**，没有外层目录，因此不写 strip_components。
          asset: "herdr-{{os|osmap:darwin=macos}}-{{arch|archmap:amd64=x86_64,arm64=aarch64}}"
          binary: herdr
          dest: "~/.local/bin"

  - id: codebase-memory-mcp
    name: codebase-memory-mcp
    stack: agent
    kind: agent
    description: 代码库知识图谱 MCP 服务
    homepage: https://github.com/DeusData/codebase-memory-mcp
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: codebase-memory-mcp, version_args: [--version], version_regex: 'codebase-memory-mcp (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: release
        when: {os: [linux]}
        params:
          repo: DeusData/codebase-memory-mcp
          # 实测：checksums.txt 逐字节命中，归档根下直接是二进制 + install.sh，**没有**外层
          # 目录（不能写 strip_components）；-portable 版是静态链接（musl/Alpine 也能跑）。
          asset: "codebase-memory-mcp-linux-{{arch}}-portable.tar.gz"
          binary: codebase-memory-mcp
          dest: "~/.local/bin"
      - via: release
        when: {os: [darwin]}
        params:
          repo: DeusData/codebase-memory-mcp
          asset: "codebase-memory-mcp-darwin-{{arch}}.tar.gz"
          binary: codebase-memory-mcp
          dest: "~/.local/bin"
      # npm/PyPI 上的同名包是"下载器 + postinstall 校验"，能用，作为 release 之外的兜底。
      - via: npm
        when: {has: [npm]}
        params: {package: codebase-memory-mcp, global: true}
      - via: pipx
        when: {has: [pipx]}
        params: {package: codebase-memory-mcp}

  # ── 监控 / 数据 / 端点可见性（低频；extras 套装） ──

  - id: netdata
    name: Netdata
    stack: base
    kind: service
    description: 实时系统监控（装完就是一个常驻服务，默认 19999 端口）
    homepage: https://www.netdata.cloud
    when: {os: [linux, darwin]}
    # 实测：`netdata -v` 打印 "netdata v1.43.2"（apt 1.43.2 与 Arch 2.x 同一格式）。
    # 注意命令在 /usr/sbin（默认 PATH 里有它，但非常规 PATH 的非 root 环境可能探测不到）。
    verify: {command: netdata, version_args: [-v], version_regex: 'netdata v(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: netdata}
      # Ubuntu/Debian 的 netdata 是个元包（依赖 netdata-core/web/plugins），
      # kind=service 正好让系统包管理器过护栏：装完就是"系统服务"的语义。
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [netdata]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [netdata]}

  - id: duckdb
    name: DuckDB
    stack: base
    kind: cli
    description: 单文件分析型 SQL 数据库 CLI
    homepage: https://duckdb.org
    when: {os: [linux, darwin]}
    verify: {command: duckdb, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: duckdb}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [duckdb]}
      # 已知缺口（别当成漏写）：Ubuntu/Debian 的**稳定版**都没打包 duckdb（Debian sid 有 1.5.5，
      # 但它要求 glibc ≥ 2.43，在 noble 上连 libicui18n.so.78 都加载不了），Fedora 也没有；
      # 上游 Release 只有 zip/tar.gz 而**不发任何校验和**（`<asset>.sha256`、checksums.txt、
      # install.duckdb.org 的 .sha256 实测全 404），按 §9.2 不能用 via: release；PyPI 的 `duckdb`
      # 也只提供 Python 模块（解包看过，没有 console script）。所以这些机器上
      # `bs tool plan duckdb` 会明确报"没有可用方式"。

  - id: clickhouse
    name: ClickHouse
    stack: base
    kind: cli
    description: 列式数据库客户端 / 本地查询
    homepage: https://clickhouse.com
    when: {os: [linux, darwin]}
    verify:
      # 发行版包给的命令叫 clickhouse-client（版本 18.16，很老）；官方单文件二进制/brew cask
      # 给的是 clickhouse（26.x，`clickhouse --version` 打印 "ClickHouse local version …"）。
      - when: {distro: [ubuntu, debian]}
        command: clickhouse-client
        version_args: [--version]
        version_regex: 'ClickHouse client version (?P<v>\d+\.\d+\.\d+)'
      - command: clickhouse
        version_args: [--version]
        version_regex: 'ClickHouse (?:client|local) version (?P<v>\d+\.\d+\.\d+)'
    install:
      - via: brew
        when: {os: [darwin]}
        params: {cask: clickhouse}   # 实测：cask 只落一个 clickhouse 二进制（不要 sudo）
      # ⚠️ Ubuntu/Debian 里的 clickhouse-client 是 2018 年的 18.16（实测 `--version` 打印
      # "ClickHouse client version 18.16.1."），上游早已 26.x。之所以只能用发行版包：官方
      # Release 的 `.tgz` 只配 **sha512**（没有 sha256），引擎只认 sha256，所以 release 走不通。
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [clickhouse-client]}

  - id: osquery
    name: osquery
    stack: base
    kind: service
    description: 用 SQL 查系统状态（osqueryi；osqueryd 是常驻采集服务）
    homepage: https://osquery.io
    when: {os: [linux, darwin]}
    # 实测：官方 tar 包里 osqueryi 是指向 osqueryd 的软链，输出随 argv[0] 变
    # （`osqueryd --version` → "osqueryd version 5.23.1"，以 osqueryi 调用 → "osqueryi version 5.23.1"），
    # 所以正则把两个名字都收进来。
    verify: {command: osqueryi, version_args: [--version], version_regex: 'osquery[di]? version (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        # 这个 cask 装的是官方 .pkg（含 launchd 服务），因此 brew 内部会要一次 sudo。
        params: {cask: osquery}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [osquery]}
      # 已知缺口：Ubuntu/Debian/Fedora 都没打包 osquery，上游 Release 不发校验和 → 无可用方式。

  # ─────────────────────── 版本管理器（先装它们） ───────────────────────

  - id: g
    name: g (Go version manager)
    stack: golang
    kind: versionmgr
    description: Go 多版本管理器（golang 条目由它落地）
    homepage: https://github.com/voidint/g
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: g, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      # 官方 release 用 sha256sum.txt（不是 goreleaser 默认的 checksums.txt）
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: voidint/g
          asset: "g{{version}}.{{os}}-{{arch}}.tar.gz"
          # 实测：归档里只有 ./g 一个条目，没有外层目录。
          binary: g
          dest: "~/.local/bin"
      - via: brew
        when: {os: [darwin]}
        params: {formula: g}
      - via: goinstall
        when: {has: [go]}
        params: {module: github.com/voidint/g@latest}

  - id: fnm
    name: fnm (Fast Node Manager)
    stack: nodejs
    kind: versionmgr
    description: Node.js 多版本管理器
    homepage: https://github.com/Schniz/fnm
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: fnm, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: fnm}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: fnm}
      # fnm 的 release 只有 zip、没有校验和文件，因此默认关闭；
      # 想用官方二进制就补上 params.sha256（见 docs/tool-schema.md）。
      - via: release
        enabled: false
        when: {os: [linux]}
        params:
          repo: Schniz/fnm
          asset: "fnm-linux.zip"
          binary: fnm
          dest: "~/.local/bin"

  - id: nvm
    name: nvm
    stack: nodejs
    kind: versionmgr
    description: Node.js 版本管理器（shell 函数型；装上后需重开 shell）
    homepage: https://github.com/nvm-sh/nvm
    when: {os: [linux, darwin]}
    provides: ["~/.nvm/nvm.sh"]
    verify: {file: "~/.nvm/nvm.sh"}
    install:
      # 仓库即安装物：按 tag 克隆到 ~/.nvm（git 自身保证完整性）
      - via: source
        when: {os: [linux, darwin]}
        params: {repo: nvm-sh/nvm, ref: v0.40.8, dest: "~/.nvm"}

  - id: uv
    name: uv
    stack: python
    kind: versionmgr
    description: 极快的 Python 包/版本管理器（uv + uvx）
    homepage: https://github.com/astral-sh/uv
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: uv, version_args: [--version], version_regex: 'uv (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: uv}
      # 每个产物都有 <asset>.sha256
      - via: release
        when: {os: [linux], arch: [amd64, arm64]}
        params:
          repo: astral-sh/uv
          asset: "uv-{{arch|archmap:amd64=x86_64,arm64=aarch64}}-unknown-linux-gnu.tar.gz"
          strip_components: 1
          extract: true
          dest: "~/.local/share/uv"
          symlinks:
            - {from: "~/.local/share/uv/uv", to: "~/.local/bin/uv"}
            - {from: "~/.local/share/uv/uvx", to: "~/.local/bin/uvx"}
      - via: release
        when: {os: [darwin], arch: [amd64, arm64]}
        params:
          repo: astral-sh/uv
          asset: "uv-{{arch|archmap:amd64=x86_64,arm64=aarch64}}-apple-darwin.tar.gz"
          strip_components: 1
          extract: true
          dest: "~/.local/share/uv"
          symlinks:
            - {from: "~/.local/share/uv/uv", to: "~/.local/bin/uv"}
            - {from: "~/.local/share/uv/uvx", to: "~/.local/bin/uvx"}

  - id: rustup
    name: rustup
    stack: rust
    kind: versionmgr
    description: Rust 工具链管理器
    homepage: https://rustup.rs
    when: {os: [linux, darwin]}
    verify: {command: rustup, version_args: [--version], version_regex: 'rustup (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: rustup}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [rustup], allow_system: true}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [rustup], allow_system: true}

  - id: mise
    name: mise
    stack: base
    kind: versionmgr
    description: 通用版本管理器（可同时管 go/node/python/rust）
    homepage: https://mise.jdx.dev
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: mise, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: mise}
      - via: cargo
        when: {has: [cargo]}
        params: {crate: mise}

  # ───────────────────────── 运行时（交给管理器） ─────────────────────────

  - id: golang
    name: Go
    stack: golang
    kind: runtime
    description: Go 工具链（由 g 管理）
    homepage: https://go.dev/dl/
    when: {os: [linux, darwin]}
    depends_on: [g]
    verify:
      command: go
      version_args: [version]
      version_regex: 'go version go(?P<v>\d+\.\d+(?:\.\d+)?)'
      min_version: "1.22"
    install:
      - via: manager
        params: {action: install, version: "{{versions.golang}}"}
      - via: manager
        when: {has: [mise]}
        params: {manager: mise, action: use, version: "go@{{versions.golang}}", global: true}
      # 全新机器上连 g 都没有时的引导路径：先装发行版自带的 go，
      # 之后 `bs tool install g` 就能走 goinstall。需要 sudo，故显式放行。
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [golang-go], allow_system: true}

  - id: nodejs
    name: Node.js
    stack: nodejs
    kind: runtime
    description: Node.js（由 fnm/nvm 管理）
    homepage: https://nodejs.org
    when: {os: [linux, darwin]}
    depends_on: [fnm]
    verify: {command: node, version_args: [--version], version_regex: 'v(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: manager
        params: {action: install, version: "{{versions.nodejs}}"}
      # 配置里把 nodejs 的管理器换成 nvm 时，depends_on 与这里都会自动跟着换
      - via: manager
        when: {has: [nvm]}
        params: {manager: nvm, action: install, version: "{{versions.nodejs}}", source: "~/.nvm/nvm.sh"}

  - id: python
    name: Python
    stack: python
    kind: runtime
    description: Python（由 uv 管理）
    homepage: https://www.python.org
    when: {os: [linux, darwin]}
    depends_on: [uv]
    verify: {command: python3, version_args: [--version], version_regex: 'Python (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: manager
        params: {action: install, version: "{{versions.python}}"}

  - id: rust
    name: Rust toolchain
    stack: rust
    kind: runtime
    description: rustc + cargo（由 rustup 管理）
    homepage: https://www.rust-lang.org
    when: {os: [linux, darwin]}
    depends_on: [rustup]
    path_dirs: ["~/.cargo/bin"]
    verify: {command: cargo, version_args: [--version], version_regex: 'cargo (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: manager
        params: {action: install, version: "{{versions.rust}}"}

  # ─────────────────────── 包管理器 / 生态工具 ───────────────────────

  - id: pnpm
    name: pnpm
    stack: nodejs
    kind: pkgmgr
    description: 节省磁盘的 Node 包管理器
    homepage: https://pnpm.io
    verify: {command: pnpm, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: pnpm}
      - via: npm
        when: {has: [npm]}
        params: {package: pnpm, global: true}

  - id: bun
    name: Bun
    stack: nodejs
    kind: pkgmgr
    description: JS/TS 运行时与包管理器
    homepage: https://bun.sh
    path_dirs: ["~/.local/bin"]
    verify: {command: bun, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: bun}
      # Bun 的 release 里有 SHASUMS256.txt
      - via: release
        when: {os: [linux], arch: [amd64, arm64]}
        params:
          repo: oven-sh/bun
          asset: "bun-linux-{{arch|archmap:amd64=x64,arm64=aarch64}}.zip"
          binary: bun
          dest: "~/.local/bin"
          checksum_file: SHASUMS256.txt

  - id: ruff
    name: Ruff
    stack: python
    kind: devdep
    description: 极快的 Python linter/formatter
    homepage: https://github.com/astral-sh/ruff
    path_dirs: ["~/.local/bin"]
    verify: {command: ruff, version_args: [--version], version_regex: 'ruff (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: ruff}
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: astral-sh/ruff
          asset: "ruff-{{arch|archmap:amd64=x86_64,arm64=aarch64}}-{{os|osmap:linux=unknown-linux-musl,darwin=apple-darwin}}.tar.gz"
          strip_components: 1
          binary: ruff
          dest: "~/.local/bin"
      - via: uvpm
        when: {has: [uv]}
        params: {package: ruff}
      - via: pipx
        when: {has: [pipx]}
        params: {package: ruff}

  - id: pipx
    name: pipx
    stack: python
    kind: pkgmgr
    description: 把 Python CLI 装进独立虚拟环境
    homepage: https://pipx.pypa.io
    verify: {command: pipx, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: pipx}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [pipx], allow_system: true}

  # ───────────────────── Go 生态开发工具（goinstall） ─────────────────────

  - id: gopls
    name: gopls
    stack: golang
    kind: devdep
    description: Go 官方语言服务器
    homepage: https://pkg.go.dev/golang.org/x/tools/gopls
    when: {os: [linux, darwin]}
    path_dirs: ["~/go/bin"]
    verify: {command: gopls, version_args: [version], version_regex: 'golang\.org/x/tools/gopls v?(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: goinstall
        when: {has: [go]}
        params: {module: golang.org/x/tools/gopls@latest}

  - id: dlv
    name: Delve
    stack: golang
    kind: devdep
    description: Go 调试器
    homepage: https://github.com/go-delve/delve
    when: {os: [linux, darwin]}
    path_dirs: ["~/go/bin"]
    verify: {command: dlv, version_args: [version], version_regex: '[Dd]elve [Dd]ebugger v?(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: goinstall
        when: {has: [go]}
        params: {module: github.com/go-delve/delve/cmd/dlv@latest}

  - id: staticcheck
    name: staticcheck
    stack: golang
    kind: devdep
    description: Go 静态分析
    homepage: https://staticcheck.dev
    when: {os: [linux, darwin]}
    path_dirs: ["~/go/bin"]
    verify: {command: staticcheck, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: goinstall
        when: {has: [go]}
        params: {module: honnef.co/go/tools/cmd/staticcheck@latest}

  # ─────────────────────── 容器 / 集群 ───────────────────────

  - id: docker
    name: Docker Engine
    stack: containers
    kind: service
    description: 容器运行时（发行版包，需要 sudo）
    homepage: https://docs.docker.com/engine/
    when: {os: [linux, darwin]}
    verify: {command: docker, version_args: [--version], version_regex: 'Docker version (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {cask: docker}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [docker.io]}

  - id: k9s
    name: k9s
    stack: infra
    kind: cli
    description: Kubernetes TUI
    homepage: https://k9scli.io
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: k9s, version_args: [version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: k9s}
      # 官方 release 的校验和文件叫 checksums.sha256
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: derailed/k9s
          asset: "k9s_{{os|osmap:linux=Linux,darwin=Darwin}}_{{arch}}.tar.gz"
          # 实测：归档根是 k9s/LICENSE/README.md，没有外层目录。
          binary: k9s
          dest: "~/.local/bin"

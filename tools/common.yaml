        when: {has: [npm]}
        params: {package: "@anthropic-ai/claude-code", global: true}

  - id: codex
    name: Codex CLI
    stack: agent
    kind: agent
    description: OpenAI 官方 CLI
    homepage: https://github.com/openai/codex
    when: {os: [linux, darwin]}
    verify: {command: codex, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: bun
        when: {has: [bun]}
        params: {package: "@openai/codex", global: true}
      - via: npm
        when: {has: [npm]}
        params: {package: "@openai/codex", global: true}

  # ═══════════════════════ M5 按 stack 补齐（2026-10-14） ═══════════════════════
  #
  # 下面这批条目都遵循同一条纪律：**每个方式都实测过名字**（apt/Arch/Fedora 的包名、
  # brew formula、npm/crates/PyPI 的包名、GitHub Release 的资产名与校验和文件）。
  # release 类条目还实测了归档结构，`strip_components` 只在该归档确实有外层目录时才写
  # ——k9s/lazygit/g 那次"把二进制剥没"的教训（design §18.4 #11）。

  # ─────────────────────────── Java 工具链 ───────────────────────────

  - id: openjdk
    name: OpenJDK 21
    stack: java
    kind: devdep
    description: Java 开发工具包（发行版包，需要 sudo）
    homepage: https://openjdk.org
    when: {os: [linux, darwin]}
    # `java -version` 把版本打到 **stderr** 且退出码为 0：探测会把 stdout+stderr 合并，
    # 因此这里不能用"只看 stdout"的写法（仓里为此有专门的单测）。
    verify: {command: java, version_args: [-version], version_regex: 'openjdk version "(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: openjdk@21}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [openjdk-21-jdk]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [java-21-openjdk-devel]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [jdk21-openjdk]}

  - id: maven
    name: Maven
    stack: java
    kind: devdep
    description: Java 构建与依赖管理（发行版版本偏旧，但足够日常用）
    homepage: https://maven.apache.org
    when: {os: [linux, darwin]}
    verify: {command: mvn, version_args: [-version], version_regex: 'Apache Maven (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: maven}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [maven]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [maven]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [maven]}

  # ─────────────────────── 构建 / 任务编排 ───────────────────────

  - id: task
    name: Task (go-task)
    stack: base
    kind: cli
    description: 用 YAML 写任务书的任务编排器（Make 的现代替代）
    homepage: https://github.com/go-task/task
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    # 版本号实测就是裸 `3.54.0`（可能带 `+<commit>` 后缀），没有前缀文案。
    verify: {command: task, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      # macOS 上 homebrew 只有 cask（`task` 这个 formula 名不存在），必须写 cask。
      - via: brew
        when: {os: [darwin]}
        params: {cask: go-task}
      # 发行版里的 `task` 是 taskwarrior（另一个工具，Ubuntu/Debian 也没有 go-task 包），
      # 所以 apt/dnf/pacman 一个都不写，只从官方 Release 装。
      # 实测 v3.54.0：资产名 task_<os>_<arch>.tar.gz，根下直接是 task 二进制
      # （另有 README/LICENSE/completion，没有外层目录），校验和文件叫
      # task_checksums.txt——不在默认候选链里，必须显式写。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: go-task/task
          asset: "task_{{os}}_{{arch}}.tar.gz"
          binary: task
          dest: "~/.local/bin"
          checksum_file: task_checksums.txt


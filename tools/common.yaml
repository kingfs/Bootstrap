  - id: dive
    name: dive
    stack: containers
    kind: cli
    description: 逐层查看镜像内容（找"镜像为什么这么大"）
    homepage: https://github.com/wagoodman/dive
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: dive, version_args: [--version], version_regex: 'dive v?(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: dive}
      # 实测：归档根下就是 CHANGELOG/LICENSE/README/dive，没有外层目录。
      # 校验和文件名带版本号（dive_0.13.1_checksums.txt），因此必须显式给 checksum_file。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: wagoodman/dive
          asset: "dive_{{version}}_{{os}}_{{arch}}.tar.gz"
          checksum_file: "dive_{{version}}_checksums.txt"
          binary: dive
          dest: "~/.local/bin"
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [dive]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [dive]}

  - id: lazydocker
    name: lazydocker
    stack: containers
    kind: cli
    description: 容器与镜像的 TUI 管理界面
    homepage: https://github.com/jesseduffield/lazydocker
    when: {os: [linux, darwin]}
    path_dirs: ["~/.local/bin"]
    verify: {command: lazydocker, version_args: [--version], version_regex: '(?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: lazydocker}
      # 实测：归档根下直接是二进制（LICENSE/README.md/lazydocker），**不能**写 strip_components。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: jesseduffield/lazydocker
          asset: "lazydocker_{{version}}_{{os|osmap:linux=Linux,darwin=Darwin}}_{{arch|archmap:amd64=x86_64,arm64=arm64}}.tar.gz"
          binary: lazydocker
          dest: "~/.local/bin"


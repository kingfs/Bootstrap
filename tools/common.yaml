    # 官方 Release **不发布任何校验和文件**（只有 .gz 归档），按纪律不能用 via: release；
    # Ubuntu/Debian 上也没有包，因此那边先用 `rustup component add rust-analyzer`。
    # 版本号是日期（rust-analyzer 2026-10-12），正则按日期写。
    verify: {command: rust-analyzer, version_args: [--version], version_regex: 'rust-analyzer (?P<v>[0-9]{4}-[0-9]{2}-[0-9]{2})'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: rust-analyzer}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [rust-analyzer]}
      - via: pacman
        when: {os: [linux], distro: [arch, manjaro]}
        params: {packages: [rust-analyzer]}


    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: kind}
      # 裸二进制 + 每个产物一个 `<资产>.sha256sum`（内容带文件名，因此给 checksum_file 就行）。
      - via: release
        when: {os: [linux, darwin]}
        params:
          repo: kubernetes-sigs/kind
          asset: "kind-{{os}}-{{arch}}"

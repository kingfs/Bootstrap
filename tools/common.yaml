    # Homebrew 的 llvm 是 keg-only，clangd 不在默认 PATH 里：不写这两行，
    # 装完立刻会被判成 missing（"PATH 里有它、但探测看不到"那类灵异现象）。
    path_dirs: ["/opt/homebrew/opt/llvm/bin", "/usr/local/opt/llvm/bin"]
    verify: {command: clangd, version_args: [--version], version_regex: 'clangd version (?P<v>\d+\.\d+\.\d+)'}
    install:
      - via: brew
        when: {os: [darwin]}
        params: {formula: llvm}
      - via: apt
        when: {os: [linux], distro: [ubuntu, debian]}
        params: {packages: [clangd]}
      - via: dnf
        when: {os: [linux], distro: [fedora, rhel, centos]}
        params: {packages: [clang-tools-extra]}

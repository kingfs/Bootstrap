# 工具套装定义：bs tool install --profile <name>
#
# 这里只放**跨平台**的套装；带平台差异的套装（cpp/containers/full）定义在
# tools/linux.yaml 与 tools/darwin.yaml 里——因为"cpp 要装哪些包"在两边不同，
# 用 when 硬凑会把清单写成一团浆糊。
#
# 加载顺序是 common → <goos> → profiles，同名 profile 后加载的整体替换（§6.3），
# 所以不要把同名 profile 分散写在这两个地方。

version: 1

profiles:
  base:
    description: 基础 CLI 与日常工具（新机器第一件事）
    tools:
      - git
      - jq
      - ripgrep
      - fzf
      - zoxide
      - btop
      - tmux
      - htop
      - duf
      - tree
      - ncdu
      - direnv
      - shellcheck
      - git-delta
      - neovim
      - lazygit
      - httpie

  golang:
    description: Go 工具链与开发工具
    extends: [base]
    tools: [g, golang, gopls, dlv, staticcheck]

  nodejs:
    description: Node.js 工具链
    extends: [base]
    tools: [fnm, nodejs, pnpm, bun]

  python:
    description: Python 工具链
    extends: [base]
    tools: [uv, python, pipx, ruff, conan]

  rust:
    description: Rust 工具链
    tools: [rustup, rust]

  rust-dev:
    description: Rust 开发工具（语言服务器、测试运行器、依赖检查、编译缓存）
    extends: [rust]
    tools: [rust-analyzer, cargo-nextest, sccache, cargo-audit, cargo-deny]

  java:
    description: Java 工具链（JDK + Maven + Gradle）
    tools: [openjdk, maven, gradle]

  editor:
    description: 编辑器
    tools: [neovim]

  infra:
    description: 集群/基础设施工具（Kubernetes 日常）
    tools: [k9s, kubectl, helm, kind, stern]

  agent:
    description: AI 编码 CLI
    tools: [claude-code, codex, gemini-cli, qwen-code, opencode, crush, copilot-cli, aider]

  # 单独一个"版本管理器全套"：想改 managers.<stack> 配置的人先用它把
  # 所有管理器都装上，再按配置切换（§6.2 的"清单无需分叉"）。
  managers:
    description: 全部版本管理器
    tools: [g, fnm, nvm, uv, rustup, mise]

  # ─────────── 按需套装：都不进 base/full，想装才装 ───────────
  #
  # 用户实测反馈：常要用的搜索/对比/监控类工具清单里没有，但它们又**不该塞进 base**——
  # `bs init` 一把梭已经要装 70+ 个。所以按用途各成一"套"，`--profile <名字>` 一步到位；
  # `tool install -i` 的"想怎么选"菜单里也能直接选套装（见 README 的交互约定）。

  search:
    description: 搜索与文件查找（bat / fd / ag）
    tools: [bat, fd, the_silver_searcher]

  diff:
    description: 差异对比与分页（delta / difftastic）
    tools: [git-delta, difftastic]

  extras:
    description: 零散但好用的按需工具（基准测试 / 日志分析 / 数据库 / 代理工作区）
    tools:
      - hyperfine
      - ctop
      - goaccess
      - netdata
      - osquery
      - duckdb
      - clickhouse
      - herdr
      - codebase-memory-mcp
